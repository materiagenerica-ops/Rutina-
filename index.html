<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Rehabilitación y Bienestar | Esclerosis Múltiple</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900 text-white py-6 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold">Plan Diario de Rehabilitación y Bienestar</h1>
                <p class="text-xs text-slate-400">Seguimiento terapéutico personalizado</p>
            </div>
            <div class="flex items-center gap-3 bg-slate-800 px-4 py-2 rounded-xl border border-slate-700">
                <label for="fechaSeleccionada" class="text-xs font-medium text-slate-300"><i class="fa-solid fa-calendar-days text-blue-400 mr-1"></i> Fecha:</label>
                <input type="date" id="fechaSeleccionada" required class="bg-slate-900 text-white text-sm px-2 py-1 rounded border border-slate-700 focus:outline-none focus:border-blue-500">
            </div>
        </div>
    </header>

    <!-- Formulario -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <form id="rutinaForm" onsubmit="enviarDatosFirebase(event)" class="space-y-8">
            
            <!-- DATOS DEL PACIENTE (OBLIGATORIO) -->
            <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-300 space-y-4">
                <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-user-pen text-blue-600"></i> Identificación del Paciente
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label for="nombrePaciente" class="block text-xs font-semibold text-slate-700">Nombre *</label>
                        <input type="text" id="nombrePaciente" required placeholder="Escribe tu nombre aquí" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="space-y-1">
                        <label for="apellidoPaciente" class="block text-xs font-semibold text-slate-700">Apellido *</label>
                        <input type="text" id="apellidoPaciente" required placeholder="Escribe tu apellido aquí" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>
            </div>

            <!-- RUTINA 1: MAÑANA -->
            <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200 space-y-6">
                <h2 class="text-xl font-bold text-slate-900 border-b pb-3">1. Rutina de la Mañana</h2>
                <div class="space-y-3">
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Mañana: Respiración y nominación de afectos" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Respiración diafragmática y nominación de afectos (5-7 min)</span>
                    </label>
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Mañana: Movilidad articular de miembros superiores" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Movilidad articular en miembros superiores y tronco (5 min)</span>
                    </label>
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Mañana: Estiramientos para espasticidad en piernas" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Estiramientos en silla para reducir espasticidad (10 min)</span>
                    </label>
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Mañana: Micro-metas de estudio" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Organización del estudio mediante "Micro-metas" (5 min)</span>
                    </label>
                </div>
            </div>

            <!-- RUTINA 2: FUERZA -->
            <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200 space-y-6">
                <h2 class="text-xl font-bold text-slate-900 border-b pb-3">2. Bloque de Fuerza y Rehabilitación</h2>
                <div class="space-y-3">
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Fuerza: Miembros superiores con pesa 1kg" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Bloque A: Brazos con Pesa de 1 kg (Sentado)</span>
                    </label>
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Fuerza: Piernas con banda elástica" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Bloque B: Piernas con Banda Elástica (Sentado)</span>
                    </label>
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Fuerza: Cierre con respiración y valoración" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Cierre de fuerza con respiración consciente (2 min)</span>
                    </label>
                </div>
            </div>

            <!-- RUTINA 3: NOCHE -->
            <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200 space-y-6">
                <h2 class="text-xl font-bold text-slate-900 border-b pb-3">3. Rutina de la Noche</h2>
                <div class="space-y-3">
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Noche: Movilidad pasiva y anti-espasticidad" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Movilidad pasiva y estiramiento anti-espasticidad (10 min)</span>
                    </label>
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Noche: Descarga mental y journaling" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Descarga mental y escritura expresiva / Journaling (10 min)</span>
                    </label>
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Noche: Escaneo corporal de relajación" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Escaneo corporal de relajación / Mindfulness (10 min)</span>
                    </label>
                    <label class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer border">
                        <input type="checkbox" name="actividad" value="Noche: Cierre del día y nominación de afectos nocturnos" class="mt-1 w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm">Cierre del día y nominación de afectos nocturnos (3 min)</span>
                    </label>
                </div>
            </div>

            <!-- OBSERVACIONES -->
            <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                <label for="observaciones" class="block text-sm font-semibold text-slate-900">Observaciones (Opcional):</label>
                <textarea id="observaciones" rows="3" placeholder="Escribe aquí..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500"></textarea>
            </div>

            <!-- BOTÓN -->
            <div>
                <button type="submit" id="btnEnviar" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-xl"></i> Enviar Registro a Mi Centro Clínico
                </button>
            </div>
        </form>
    </main>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https
