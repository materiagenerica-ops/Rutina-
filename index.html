<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Rehabilitación y Bienestar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-6">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-slate-900">Plan Diario de Rehabilitación</h1>

        <form id="rutinaForm" onsubmit="enviarDatosFirebase(event)" class="space-y-6">
            
            <!-- DATOS DEL PACIENTE -->
            <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl space-y-4">
                <h2 class="font-bold text-blue-900 text-base">Identificación del Paciente</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="nombrePaciente" class="block text-xs font-semibold text-slate-700 mb-1">Nombre *</label>
                        <input type="text" id="nombrePaciente" required placeholder="Tu nombre" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm">
                    </div>
                    <div>
                        <label for="apellidoPaciente" class="block text-xs font-semibold text-slate-700 mb-1">Apellido *</label>
                        <input type="text" id="apellidoPaciente" required placeholder="Tu apellido" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm">
                    </div>
                </div>
                <div>
                    <label for="fechaSeleccionada" class="block text-xs font-semibold text-slate-700 mb-1">Fecha de la sesión *</label>
                    <input type="date" id="fechaSeleccionada" required class="w-full sm:w-auto bg-white border border-slate-300 rounded-lg p-2 text-sm">
                </div>
            </div>

            <!-- ACTIVIDADES -->
            <div class="space-y-3">
                <h2 class="font-bold text-slate-900 text-base">Actividades del Plan</h2>
                
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border cursor-pointer">
                    <input type="checkbox" name="actividad" value="Mañana: Respiración y nominación de afectos" class="w-4 h-4 text-blue-600">
                    <span class="text-sm">Respiración diafragmática y nominación de afectos</span>
                </label>

                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border cursor-pointer">
                    <input type="checkbox" name="actividad" value="Mañana: Movilidad articular" class="w-4 h-4 text-blue-600">
                    <span class="text-sm">Movilidad articular en miembros superiores y tronco</span>
                </label>

                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border cursor-pointer">
                    <input type="checkbox" name="actividad" value="Mañana: Estiramientos para espasticidad" class="w-4 h-4 text-blue-600">
                    <span class="text-sm">Estiramientos en silla para reducir espasticidad</span>
                </label>

                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border cursor-pointer">
                    <input type="checkbox" name="actividad" value="Fuerza: Brazos con pesa 1kg y piernas con banda" class="w-4 h-4 text-blue-600">
                    <span class="text-sm">Bloque de fuerza (pesa 1kg y banda elástica)</span>
                </label>

                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border cursor-pointer">
                    <input type="checkbox" name="actividad" value="Noche: Movilidad pasiva y journaling" class="w-4 h-4 text-blue-600">
                    <span class="text-sm">Rutina nocturna (movilidad pasiva y journaling)</span>
                </label>
            </div>

            <!-- OBSERVACIONES -->
            <div>
                <label for="observaciones" class="block text-xs font-semibold text-slate-700 mb-1">Observaciones / Comentarios</label>
                <textarea id="observaciones" rows="3" placeholder="Comentarios opcionales..." class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm"></textarea>
            </div>

            <!-- BOTÓN -->
            <button type="submit" id="btnEnviar" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow transition-all">
                Enviar Registro a Mi Centro Clínico
            </button>
        </form>
    </div>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUFWeEfNnaV5M57O5EPJscarwRZb9jRk0",
            authDomain: "rutina-eslerosis.firebaseapp.com",
            projectId: "rutina-eslerosis",
            storageBucket: "rutina-eslerosis.firebasestorage.app",
            messagingSenderId: "701973748602",
            appId: "1:701973748602:web:ed22f8c8711298b3d894c3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0];

        window.enviarDatosFirebase = async function(event) {
            event.preventDefault();

            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;
            btn.textContent = "Enviando...";

            const nombre = document.getElementById('nombrePaciente').value.trim();
            const apellido = document.getElementById('apellidoPaciente').value.trim();
            const fecha = document.getElementById('fechaSeleccionada').value;
            const observaciones = document.getElementById('observaciones').value.trim();
            
            const checkboxes = document.querySelectorAll('input[name="actividad"]:checked');
            const actividadesCompletadas = Array.from(checkboxes).map(cb => cb.value);

            try {
                await addDoc(collection(db, "registros_paciente"), {
                    nombre: nombre,
                    apellido: apellido,
                    fecha: fecha,
                    actividades: actividadesCompletadas,
                    totalCompletadas: actividadesCompletadas.length,
                    totalPosibles: 5,
                    observaciones: observaciones,
                    timestamp: serverTimestamp()
                });

                alert("¡Enviado con éxito!");
                document.getElementById('rutinaForm').reset();
                document.getElementById('fechaSeleccionada').value = new Date().toISOString().split('T')[0];
            } catch (error) {
                console.error(error);
                alert("Error al enviar los datos.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Enviar Registro a Mi Centro Clínico";
            }
        }
    </script>
</body>
</html>
